name = "lofi-reconciliation"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Fetch new payouts every morning, 6:00 Sydney (20:00 UTC in AEDT, 19:00 in AEST).
[triggers]
crons = ["0 20 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lofi-recon"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # wrangler d1 create lofi-recon

[vars]
SHOPIFY_SHOP = "lofi-music.myshopify.com"
SHOPIFY_API_VERSION = "2026-10"   # pinned; review each quarter (Shopify supports a version for at least 12 months)
EBAY_MARKETPLACE_ID = "EBAY_AU"
# Days of payouts to look back on each run.
LOOKBACK_DAYS = "14"

# Secrets (set with `wrangler secret put <NAME>`):
#   SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET   Dev Dashboard app (client credentials grant):
#                         read_orders, read_shopify_payments_payouts, read_shopify_payments_accounts
#                         (or SHOPIFY_ADMIN_TOKEN for an older admin-created app)
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REFRESH_TOKEN
#                         scopes: sell.finances, sell.fulfillment.readonly
#   DASHBOARD_TOKEN       shared secret for the dashboard (or put the Worker behind Cloudflare Access)
